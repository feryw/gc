name: Build Static GC

on:
  repository_dispatch:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        arch: [armv5, armv6, armv7, armhf]

    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
            make cmake pkg-config autoconf automake libtool git

      - name: Build libconfig static
        run: |
          git clone https://github.com/hyperrealm/libconfig.git
          cd libconfig

          mkdir build && cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=arm \
            -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr

          make -j$(nproc)
          make DESTDIR=/tmp/sysroot install
          find /tmp/sysroot 
          
      - name: Build libusbgx static
        run: |
          git clone https://github.com/libusbgx/libusbgx.git
          cd libusbgx
          ./autogen.sh || true
          ./configure --host=arm-linux-gnueabihf --enable-static --disable-shared \
            CC=arm-linux-gnueabihf-gcc PKG_CONFIG_PATH=/tmp/sysroot/usr/local/lib/pkgconfig
          make -j$(nproc)
          sudo make install DESTDIR=/tmp/sysroot

      - name: Build gc (static)
        run: |
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
            -DCMAKE_FIND_ROOT_PATH=/tmp/sysroot/usr/local \
            -DCMAKE_EXE_LINKER_FLAGS="-static"
          make -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gc-${{ matrix.arch }}-static
          path: build/bin/gc
